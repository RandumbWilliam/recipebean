name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run tsc

  deploy:
    name: Migrate & Deploy
    needs: check
    # Only deploy on push (or manual dispatch) to main, never on pull requests.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Drizzle Kit connects directly to Postgres (not through Hyperdrive), so
      # DATABASE_MIGRATIONS_URL must be the direct Neon URL with ?sslmode=require.
      - name: Run migrations
        run: bun run db:migrate
        env:
          DATABASE_MIGRATIONS_URL: ${{ secrets.DATABASE_MIGRATIONS_URL }}

      - name: Build and deploy
        run: bun run deploy
        env:
          # Build-time only: baked into the client (SPA) bundle by `nuxt build`.
          NUXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NUXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          # Used by `wrangler deploy` to authenticate to Cloudflare.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
